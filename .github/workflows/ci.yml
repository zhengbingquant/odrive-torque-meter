name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Tests (core + GUI against the simulator)
        run: python -m pytest -v
      - name: Command-line tools
        run: |
          python -m torque_meter --version
          python -m torque_meter info --connection simulator
          python -m torque_meter monitor --connection simulator --kv 100 --gear 9 --seconds 1
      - name: Optional official odrive library installs
        continue-on-error: true
        run: |
          python -m pip install odrive
          python -c "import odrive; print('odrive library imports fine')"

  launchers:
    name: Launcher script on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: First run of start_mac.command (creates .venv, installs, starts)
        if: runner.os == 'macOS'
        run: bash start_mac.command --version
      - name: First run of start_windows.bat (creates .venv, installs, starts)
        if: runner.os == 'Windows'
        shell: cmd
        run: call start_windows.bat --version
